<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JH Media Growth - SMM Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Auth Container -->
    <div id="auth-container" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md shadow-xl">
            <h2 id="auth-title" class="text-2xl font-bold text-center mb-6 text-indigo-400">Login</h2>
            <div id="auth-message" class="mb-4 text-sm text-center text-red-400"></div>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div id="name-field" class="mb-4 hidden">
                    <label class="block text-sm mb-2">Your Name</label>
                    <input type="text" id="name" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                </div>
                <div class="mb-4">
                    <label class="block text-sm mb-2">Email Address</label>
                    <input type="email" id="email" required list="email-suggestions" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white" placeholder="example@gmail.com">
                    <datalist id="email-suggestions">
                        <option value="your-email1@gmail.com"><option value="your-email2@gmail.com">
                    </datalist>
                </div>
                <div class="mb-6">
                    <label class="block text-sm mb-2">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden p-4 max-w-4xl mx-auto">
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-6 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-400">JH Media Growth</h1>
            <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded-lg text-xs">Logout</button>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl mb-8">
            <h2 class="text-lg font-bold mb-4 text-indigo-400">New Order</h2>
            <form id="order-form" onsubmit="submitOrder(event)">
                <div class="mb-4">
                    <label class="block text-sm mb-2">Select Service</label>
                    <select id="service-select" onchange="updateServiceDetails()" class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <option value="">-- Choose a Service --</option>
                        <optgroup label="YouTube Shorts Views">
                            <option value="YT Shorts 5K" data-charge="250">5K Views - 250 Tk</option>
                            <option value="YT Shorts 10K" data-charge="500">10K Views - 500 Tk</option>
                            <option value="YT Shorts 1M" data-charge="1150">1 Million Views - 1150 Tk</option>
                        </optgroup>
                        <optgroup label="YouTube Long Video Views">
                            <option value="YT Long 1K" data-charge="350">1K Views - 350 Tk</option>
                            <option value="YT Long 10K" data-charge="750">10K Views - 750 Tk</option>
                            <option value="YT Long 50K" data-charge="1350">50K Views - 1350 Tk</option>
                            <option value="YT Long 1M" data-charge="2500">1 Million Views - 2500 Tk</option>
                        </optgroup>
                        <optgroup label="YouTube Subscribers">
                            <option value="YT Sub 1K" data-charge="50">1K Subs - 50 Tk</option>
                            <option value="YT Sub 5K" data-charge="250">5K Subs - 250 Tk</option>
                            <option value="YT Sub 10K" data-charge="550">10K Subs - 550 Tk</option>
                        </optgroup>
                        <optgroup label="Facebook Video Views">
                            <option value="FB View 10K" data-charge="150">10K Views - 150 Tk</option>
                            <option value="FB View 50K" data-charge="450">50K Views - 450 Tk</option>
                            <option value="FB View 1M" data-charge="2450">1 Million Views - 2450 Tk</option>
                        </optgroup>
                        <optgroup label="Facebook Followers">
                            <option value="FB Fol 1K" data-charge="25">1K Followers - 25 Tk</option>
                            <option value="FB Fol 5K" data-charge="250">5K Followers - 250 Tk</option>
                            <option value="FB Fol 10K" data-charge="550">10K Followers - 550 Tk</option>
                        </optgroup>
                        <optgroup label="Instagram">
                            <option value="IG Fol 1K" data-charge="30">Followers 1K - 30 Tk</option>
                            <option value="IG Fol 5K" data-charge="140">Followers 5K - 140 Tk</option>
                            <option value="IG View 1K" data-charge="25">Views 1K - 25 Tk</option>
                            <option value="IG View 10K" data-charge="300">Views 10K - 300 Tk</option>
                        </optgroup>
                        <optgroup label="TikTok">
                            <option value="TT Fol 1K" data-charge="20">Followers 1K - 20 Tk</option>
                            <option value="TT Fol 5K" data-charge="100">Followers 5K - 100 Tk</option>
                            <option value="TT Fol 10K" data-charge="200">Followers 10K - 200 Tk</option>
                            <option value="TT View 5K" data-charge="40">Views 5K - 40 Tk</option>
                            <option value="TT View 10K" data-charge="80">Views 10K - 80 Tk</option>
                        </optgroup>
                    </select>
                </div>

                <!-- পেমেন্ট সেকশন -->
                <div class="bg-slate-800 p-4 rounded-lg mb-4 border border-slate-700">
                    <p class="text-sm font-semibold mb-2">Select Payment Method:</p>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="payment-method" value="Bkash" checked class="w-4 h-4"> Bkash
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="payment-method" value="Nagad" class="w-4 h-4"> Nagad
                        </label>
                    </div>
                    <p class="text-sm mt-3 text-slate-300">Total: <span id="display-charge" class="text-indigo-400 font-bold">0</span> Tk</p>
                </div>

                <div class="mb-4">
                    <label class="block text-sm mb-2">Link</label>
                    <input type="url" id="order-link" required class="w-full bg-slate-800 p-3 rounded-lg" placeholder="https://...">
                </div>
                <button type="submit" class="w-full bg-indigo-600 py-3 rounded-lg font-bold">Confirm Order</button>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6ljlYlh1fnw8WrAgT7wGJUkiqk1e6tmPHHjo69xPghBnRnHbnFEX8AvpK4yA-0hVXkQ/exec";
        
        function updateServiceDetails() {
            const s = document.getElementById("service-select");
            const charge = s.options[s.selectedIndex].getAttribute("data-charge") || "0";
            document.getElementById("display-charge").innerText = charge;
        }

        function handleAuth(e) { e.preventDefault(); /* Auth logic here */ showDashboard("User"); }
        function showDashboard(email) { document.getElementById("auth-container").classList.add("hidden"); document.getElementById("dashboard").classList.remove("hidden"); }
        function logout() { location.reload(); }

        function submitOrder(e) {
            e.preventDefault();
            const s = document.getElementById("service-select");
            const data = { 
                service: s.value,
                charge: document.getElementById("display-charge").innerText + " Tk",
                payment: document.querySelector('input[name="payment-method"]:checked').value,
                link: document.getElementById("order-link").value
            };
            alert("Order Submitted for " + data.service + " via " + data.payment);
        }
    </script>
</body>
</html>
