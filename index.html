<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global SMM Panel - Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

  <!-- Navbar -->
  <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <span class="font-bold text-xl tracking-wider">JH Media Growth</span>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Left Column: New Order Form -->
    <div class="lg:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
      <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
        <i class="fa-solid fa-cart-shopping text-indigo-500"></i> নতুন অর্ডার করুন
      </h2>
      
      <form id="orderForm" onsubmit="handleOrderSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">সার্ভিস নির্বাচন করুন</label>
          <select id="serviceSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500" required>
            <option value="">সার্ভিস লোড হচ্ছে...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">লিংক (Link)</label>
          <input type="url" id="orderLink" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">পরিমাণ (Quantity)</label>
          <input type="number" id="orderQty" placeholder="1000" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500" required>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">ইমেইল (Email)</label>
          <input type="email" id="orderEmail" placeholder="your@email.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500" required>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition duration-200">
          অর্ডার সাবমিট করুন
        </button>
      </form>
    </div>

    <!-- Right Column: Orders History Table -->
    <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
      <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
        <i class="fa-solid fa-history text-indigo-500"></i> অর্ডার হিস্ট্রি
      </h2>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400 text-sm">
              <th class="py-3 px-3">Order ID</th>
              <th class="py-3 px-3">Service</th>
              <th class="py-3 px-3">Link</th>
              <th class="py-3 px-3">Qty</th>
              <th class="py-3 px-3">Cost</th>
              <th class="py-3 px-3">Status</th>
            </tr>
          </thead>
          <tbody id="ordersTable" class="text-sm divide-y divide-slate-800">
            <tr>
              <td colspan="6" class="py-6 text-center text-slate-500">হিস্ট্রি লোড হচ্ছে...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- JavaScript Integration -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwz8X6MdPxfBWHM2FQqWYeUsmk0rf_YkOkFeYE9ihWCl1AMvL7Qbm9Bm9oSlG-5uBd0kQ/exec";

    // Load Services from API
    async function loadServices() {
      try {
        const res = await fetch(SCRIPT_URL + "?action=getServices");
        const services = await res.json();
        const serviceSelect = document.getElementById("serviceSelect");
        if (serviceSelect) {
            serviceSelect.innerHTML = '<option value="">সার্ভিস নির্বাচন করুন</option>';
            services.forEach(s => {
              const opt = document.createElement("option");
              opt.value = s.name;
              opt.dataset.rate = s.rate;
              opt.textContent = `${s.name} - $${s.rate}`;
              serviceSelect.appendChild(opt);
            });
        }
      } catch (err) {
        console.error("Error loading services:", err);
      }
    }

    // Load Orders from API
    async function loadOrders() {
      try {
        const res = await fetch(SCRIPT_URL + "?action=getOrders");
        const orders = await res.json();
        const tableBody = document.getElementById("ordersTable");
        if (tableBody) {
            tableBody.innerHTML = '';
            if(orders.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-500">কোনো অর্ডার পাওয়া যায়নি</td></tr>`;
                return;
            }
            orders.forEach(o => {
              tableBody.innerHTML += `<tr class="hover:bg-slate-800/50 border-b border-slate-800/50">
                <td class="py-3 px-3">${o.orderId || o.id || ''}</td>
                <td class="py-3 px-3">${o.service || ''}</td>
                <td class="py-3 px-3 truncate max-w-xs">${o.link || ''}</td>
                <td class="py-3 px-3">${o.quantity || o.qty || ''}</td>
                <td class="py-3 px-3">$${o.charge || o.cost || '0.00'}</td>
                <td class="py-3 px-3"><span class="px-2 py-1 bg-amber-500/10 text-amber-400 rounded text-xs">${o.status || 'Pending'}</span></td>
              </tr>`;
            });
        }
      } catch (err) {
        console.error("Error loading orders:", err);
      }
    }

    // Handle Order Submit
    async function handleOrderSubmit(e) {
      e.preventDefault();
      
      const service = document.getElementById("serviceSelect").value;
      const link = document.getElementById("orderLink").value;
      const qty = document.getElementById("orderQty").value;
      const email = document.getElementById("orderEmail").value;
      const cost = (qty * 0.01).toFixed(2);

      const orderData = { service, link, quantity: qty, email, charge: cost };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        alert("অর্ডার সফলভাবে সাবমিট হয়েছে!");
        document.getElementById("orderForm").reset();
        setTimeout(loadOrders, 2000);
      } catch (err) {
        console.error("Order submission error:", err);
        alert("অর্ডার সাবমিট করতে সমস্যা হয়েছে।");
      }
    }

    // Page load initialization
    window.onload = () => {
      loadServices();
      loadOrders();
    };
  </script>
</body>
</html>
