<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JH Media Growth Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111827; color: #ffffff; margin: 0; padding: 15px; }
        .container { max-width: 450px; margin: 20px auto; background: #1f2937; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2, h1 { text-align: center; color: #f3f4f6; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; background: #374151; border: 1px solid #4b5563; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .hidden { display: none; }
        .order-card { background: #374151; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #4b5563; font-size: 13px; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .bg-orange { background: #c2410c; }
        .bg-blue { background: #1d4ed8; }
        .bg-green { background: #15803d; }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .text-yellow { color: #facc15; }
        .text-muted { color: #9ca3af; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Login / Sign Up Section -->
    <div id="loginContainer" class="container">
        <h2 id="authTitle">Login to JH Media</h2>
        <form onsubmit="return false;">
            <input type="text" id="nameInput" placeholder="Enter your name" class="hidden">
            <input type="email" id="emailInput" placeholder="Enter your email">
            <div style="position: relative;">
                <input type="password" id="passInput" placeholder="Password">
                <button type="button" onclick="togglePassword()" style="position: absolute; right: 10px; top: 10px; width: auto; padding: 5px 10px; font-size: 11px; background: #4b5563;">Show</button>
            </div>
            <button id="authBtn" onclick="handleAuth()" style="margin-top: 10px;">Login</button>
        </form>
        <p style="text-align: center; font-size: 12px; color: #9ca3af; margin-top: 15px;">
            <span id="switchText">Don't have an account?</span> 
            <button onclick="toggleAuthMode()" style="background: none; color: #60a5fa; border: none; width: auto; display: inline; text-decoration: underline; cursor: pointer;" id="switchBtn">Sign Up</button>
        </p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="container hidden">
        <div class="flex" style="margin-bottom: 20px;">
            <h1 style="margin: 0; font-size: 20px;">JH Media Dashboard</h1>
            <button onclick="logout()" style="width: auto; background: #dc2626; padding: 6px 12px; font-size: 12px;">Logout</button>
        </div>

        <!-- Create Order Box -->
        <div style="background: #111827; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-top: 0; color: #e5e7eb;">Create New Order</h3>
            
            <select id="service">
                <option value="">-- Choose Your Service --</option>
                <optgroup label="YouTube Shorts Views">
                    <option value="YT Shorts 5K - 250tk">YouTube Shorts 5K - 250tk</option>
                    <option value="YT Shorts 10K - 500tk">YouTube Shorts 10K - 500tk</option>
                    <option value="YT Shorts 1M - 1150tk">YouTube Shorts 1M - 1150tk</option>
                </optgroup>
                <optgroup label="YouTube Long Video Views">
                    <option value="YT Long 1K - 350tk">YouTube Long 1K - 350tk</option>
                    <option value="YT Long 10K - 750tk">YouTube Long 10K - 750tk</option>
                    <option value="YT Long 50K - 1350tk">YouTube Long 50K - 1350tk</option>
                </optgroup>
                <optgroup label="YouTube Subscribers">
                    <option value="YT Sub 1000 - 50tk">YouTube Subscribers 1000 - 50tk</option>
                    <option value="YT Sub 5000 - 250tk">YouTube Subscribers 5000 - 250tk</option>
                </optgroup>
                <optgroup label="Facebook Followers & Views">
                    <option value="FB Video 10K - 150tk">Facebook Video 10K - 150tk</option>
                    <option value="FB Follow 1000 - 25tk">Facebook Followers 1000 - 25tk</option>
                </optgroup>
                <optgroup label="Instagram & TikTok">
                    <option value="IG Follow 1000 - 30tk">Instagram Followers 1000 - 30tk</option>
                    <option value="TT Follow 1000 - 20tk">TikTok Followers 1000 - 20tk</option>
                </optgroup>
            </select>

            <input type="text" id="link" placeholder="Order Link">
            
            <select id="paymentMethod">
                <option value="Bkash">Bkash</option>
                <option value="Nagad">Nagad</option>
                <option value="Rocket">Rocket</option>
            </select>

            <input type="text" id="senderNumber" placeholder="Sender Number">
            <input type="text" id="trxId" placeholder="Transaction ID">

            <button onclick="submitOrder()" id="submitBtn" style="background: #4f46e5;">Confirm Order</button>
        </div>

        <!-- My Orders & Status Tracking Section -->
        <div style="background: #111827; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-top: 0; color: #60a5fa;">My Orders & Status</h3>
            <div id="ordersList">
                <p class="text-muted">Loading orders...</p>
            </div>
        </div>

        <!-- Admin Panel -->
        <div id="adminContainer" class="hidden" style="background: #111827; padding: 15px; border-radius: 8px; border: 1px solid #d97706;">
            <h3 style="margin-top: 0; color: #f59e0b;">Admin Control</h3>
            <p class="text-muted" style="color: #f3f4f6;">Central Database Linked: You can view all orders directly from your Google Sheet.</p>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "jhmediagrowth@gmail.com";
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyZOr01dr2vYgtW-ZR6VBDDmM7q8rJROdXHXSL-pXWaoTqIPaI3PmIDvaX7ptA3z4h/exec";

        function togglePassword() {
            const p = document.getElementById('passInput');
            const btn = event.target;
            if (p.type === 'password') {
                p.type = 'text';
                btn.innerText = 'Hide';
            } else {
                p.type = 'password';
                btn.innerText = 'Show';
            }
        }

        function toggleAuthMode() {
            const nameInput = document.getElementById('nameInput');
            const isHidden = nameInput.classList.toggle('hidden');
            
            document.getElementById('authTitle').innerText = isHidden ? "Login to JH Media" : "Sign Up for JH Media";
            document.getElementById('authBtn').innerText = isHidden ? "Login" : "Sign Up";
            document.getElementById('switchText').innerText = isHidden ? "Don't have an account?" : "Already have an account?";
            document.getElementById('switchBtn').innerText = isHidden ? "Sign Up" : "Login";
        }

        function handleAuth() {
            const email = document.getElementById('emailInput').value;
            if(!email) return alert("Please enter your email!");
            localStorage.setItem("userEmail", email);
            location.reload();
        }

        function logout() { 
            localStorage.clear(); 
            location.reload(); 
        }

        async function submitOrder() {
            const email = localStorage.getItem("userEmail");
            const service = document.getElementById('service').value;
            const link = document.getElementById('link').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const senderNumber = document.getElementById('senderNumber').value;
            const trxId = document.getElementById('trxId').value;

            if(!service || !link || !senderNumber || !trxId) {
                return alert("Please fill all fields!");
            }

            const orderData = {
                id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
                email: email,
                service: service,
                link: link,
                paymentMethod: paymentMethod,
                senderNumber: senderNumber,
                trxId: trxId,
                status: "Pending"
            };

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Submitting to Database...";
            btn.disabled = true;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                alert("Order Submitted Successfully to Google Sheet!");
                document.getElementById('link').value = '';
                document.getElementById('senderNumber').value = '';
                document.getElementById('trxId').value = '';
                loadUserOrders();
            } catch (error) {
                console.error("Error:", error);
                alert("Order submitted, syncing with sheet...");
                loadUserOrders();
            } finally {
                btn.innerText = "Confirm Order";
                btn.disabled = false;
            }
        }

        function getStatusColor(status) {
            if (status === 'Pending') return 'bg-orange';
            if (status === 'Processing') return 'bg-blue';
            if (status === 'Completed') return 'bg-green';
            return 'bg-orange';
        }

        async function loadUserOrders() {
            const ordersList = document.getElementById('ordersList');
            const currentUserEmail = localStorage.getItem("userEmail");

            try {
                const response = await fetch(SCRIPT_URL);
                const orders = await response.json();

                const filteredOrders = (currentUserEmail === ADMIN_EMAIL) 
                    ? orders.slice(1) 
                    : orders.filter(o => o.Email === currentUserEmail);

                if(filteredOrders.length === 0) {
                    ordersList.innerHTML = '<p class="text-muted">No orders placed yet.</p>';
                    return;
                }

                ordersList.innerHTML = filteredOrders.reverse().map(o => `
                    <div class="order-card">
                        <div class="flex" style="margin-bottom: 5px;">
                            <span style="font-size: 11px; color: #facc15; font-family: monospace;">${o.OrderID || 'N/A'}</span>
                            <span class="badge ${getStatusColor(o.Status)}">${o.Status || 'Pending'}</span>
                        </div>
                        <p style="font-weight: bold; color: #a5b4fc; margin: 5px 0;">${o.Service}</p>
                        <p style="font-size: 11px; color: #d1d5db; margin: 3px 0; word-break: break-all;">Link: ${o.Link}</p>
                        <div class="flex" style="margin-top: 8px; font-size: 11px; color: #9ca3af;">
                            <span>Paid (${o.PaymentMethod}): ${o.SenderNumber}</span>
                            <span>TrxID: ${o.TrxId}</span>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error("Failed to load orders:", error);
                ordersList.innerHTML = '<p style="color: #f87171; font-size: 12px;">Failed to sync orders from database.</p>';
            }
        }

        window.onload = () => {
            const email = localStorage.getItem("userEmail");
            if(email) {
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                if(email === ADMIN_EMAIL) {
                    document.getElementById('adminContainer').classList.remove('hidden');
                }
                loadUserOrders();
            }
        };
    </script>
</body>
</html>
