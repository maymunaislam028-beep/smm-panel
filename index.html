<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JH Media Growth Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">

    <!-- Login / Sign Up Section -->
    <div id="loginContainer" class="max-w-md mx-auto mt-10 bg-gray-800 p-6 rounded-xl shadow-2xl">
        <h2 id="authTitle" class="text-xl font-bold mb-4 text-center">Login to JH Media</h2>
        <form onsubmit="return false;">
            <input type="text" id="nameInput" placeholder="Enter your name" class="w-full p-3 mb-3 bg-gray-700 rounded border border-gray-600 hidden">
            <input type="email" id="emailInput" placeholder="Enter your email" autocomplete="email" class="w-full p-3 mb-3 bg-gray-700 rounded border border-gray-600">
            <div class="relative mb-4">
                <input type="password" id="passInput" placeholder="Password" autocomplete="current-password" class="w-full p-3 bg-gray-700 rounded border border-gray-600">
                <button type="button" onclick="togglePassword()" class="absolute right-3 top-3.5 text-xs text-blue-400">Show</button>
            </div>
            <button id="authBtn" onclick="handleAuth()" class="w-full bg-blue-600 py-3 rounded font-bold">Login</button>
        </form>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">JH Media Dashboard</h1>
            <button onclick="logout()" class="bg-red-600 px-3 py-1 rounded text-sm">Logout</button>
        </div>

        <div class="bg-gray-800 p-5 rounded-xl mb-6 shadow-lg">
            <h2 class="font-bold mb-3">Create New Order</h2>
            
            <!-- সম্পূর্ণ সার্ভিস লিস্ট -->
            <select id="service" class="w-full p-3 mb-3 bg-gray-700 rounded border border-gray-600">
                <option value="">-- Choose Your Service --</option>
                <optgroup label="YouTube Shorts Views">
                    <option value="YT Shorts 5K - 250tk">YouTube Shorts 5K - 250tk</option>
                    <option value="YT Shorts 10K - 500tk">YouTube Shorts 10K - 500tk</option>
                    <option value="YT Shorts 1M - 1150tk">YouTube Shorts 1M - 1150tk</option>
                </optgroup>
                <optgroup label="YouTube Long Video Views">
                    <option value="YT Long 1K - 350tk">YouTube Long 1K - 350tk</option>
                    <option value="YT Long 10K - 750tk">YouTube Long 10K - 750tk</option>
                    <option value="YT Long 50K - 1350tk">YouTube Long 50K - 1350tk</option>
                    <option value="YT Long 1000K - 2500tk">YouTube Long 1000K - 2500tk</option>
                </optgroup>
                <optgroup label="YouTube Subscribers">
                    <option value="YT Sub 1000 - 50tk">YouTube Subscribers 1000 - 50tk</option>
                    <option value="YT Sub 5000 - 250tk">YouTube Subscribers 5000 - 250tk</option>
                    <option value="YT Sub 10000 - 550tk">YouTube Subscribers 10000 - 550tk</option>
                </optgroup>
                <optgroup label="Facebook Video Views">
                    <option value="FB Video 10K - 150tk">Facebook Video 10K - 150tk</option>
                    <option value="FB Video 50K - 450tk">Facebook Video 50K - 450tk</option>
                    <option value="FB Video 1M - 2450tk">Facebook Video 1M - 2450tk</option>
                </optgroup>
                <optgroup label="Facebook Followers">
                    <option value="FB Follow 1000 - 25tk">Facebook Followers 1000 - 25tk</option>
                    <option value="FB Follow 5000 - 250tk">Facebook Followers 5000 - 250tk</option>
                    <option value="FB Follow 10000 - 550tk">Facebook Followers 10000 - 550tk</option>
                </optgroup>
                <optgroup label="Instagram Followers & Views">
                    <option value="IG Follow 1000 - 30tk">Instagram Followers 1000 - 30tk</option>
                    <option value="IG Follow 5000 - 140tk">Instagram Followers 5000 - 140tk</option>
                    <option value="IG View 1000 - 25tk">Instagram Views 1000 - 25tk</option>
                    <option value="IG View 10000 - 300tk">Instagram Views 10000 - 300tk</option>
                </optgroup>
                <optgroup label="TikTok Followers & Views">
                    <option value="TT Follow 1000 - 20tk">TikTok Followers 1000 - 20tk</option>
                    <option value="TT Follow 5000 - 100tk">TikTok Followers 5000 - 100tk</option>
                    <option value="TT Follow 10000 - 200tk">TikTok Followers 10000 - 200tk</option>
                    <option value="TT View 5K - 40tk">TikTok Views 5K - 40tk</option>
                    <option value="TT View 10K - 80tk">TikTok Views 10K - 80tk</option>
                </optgroup>
            </select>

            <input type="text" id="link" placeholder="Order Link" class="w-full p-3 mb-3 bg-gray-700 rounded border border-gray-600">
            
            <!-- পেমেন্ট মেথড -->
            <select id="paymentMethod" class="w-full p-3 mb-3 bg-gray-700 rounded border border-gray-600">
                <option value="Bkash">Bkash</option>
                <option value="Nagad">Nagad</option>
                <option value="Rocket">Rocket</option>
            </select>

            <input type="text" id="senderNumber" placeholder="Sender Number" class="w-full p-3 mb-3 bg-gray-700 rounded border border-gray-600">
            <input type="text" id="trxId" placeholder="Transaction ID" class="w-full p-3 mb-4 bg-gray-700 rounded border border-gray-600">

            <button onclick="submitOrder()" class="w-full bg-indigo-600 py-3 rounded font-bold">Confirm Order</button>
        </div>

        <!-- Admin Panel -->
        <div id="adminContainer" class="hidden bg-gray-800 p-5 rounded-xl border border-yellow-600">
            <h2 class="text-yellow-500 font-bold mb-2">Admin Control</h2>
            <p class="text-sm text-gray-300">Order management system is active.</p>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "jhmediagrowth@gmail.com";

        function togglePassword() {
            const p = document.getElementById('passInput');
            const btn = event.target;
            if (p.type === 'password') {
                p.type = 'text';
                btn.innerText = 'Hide';
            } else {
                p.type = 'password';
                btn.innerText = 'Show';
            }
        }

        function handleAuth() {
            const email = document.getElementById('emailInput').value;
            if(!email) return alert("Please enter your email!");
            localStorage.setItem("userEmail", email);
            location.reload();
        }

        function logout() { 
            localStorage.clear(); 
            location.reload(); 
        }

        function submitOrder() { 
            alert("Order Submitted Successfully!"); 
        }

        window.onload = () => {
            const email = localStorage.getItem("userEmail");
            if(email) {
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                if(email === ADMIN_EMAIL) {
                    document.getElementById('adminContainer').classList.remove('hidden');
                }
            }
        };
    </script>
</body>
</html>
