<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JH Media Growth Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">

    <!-- লগইন / সাইন আপ সেকশন -->
    <div id="loginContainer" class="max-w-md mx-auto mt-16 bg-gray-800 p-6 rounded-lg shadow-lg">
        <h2 id="authTitle" class="text-xl font-bold mb-4 text-center">Login to JH Media</h2>
        
        <input type="text" id="nameInput" placeholder="Enter your name" class="w-full p-2.5 mb-3 bg-gray-700 rounded border border-gray-600 text-sm hidden">
        <!-- এখানে type="email" দেওয়া হয়েছে যাতে ব্রাউজার থেকে জিমেইল সাজেস্ট করে -->
        <input type="email" id="emailInput" placeholder="Enter your email" autocomplete="email" class="w-full p-2.5 mb-3 bg-gray-700 rounded border border-gray-600 text-sm">
        <input type="password" id="passInput" placeholder="Enter your password" class="w-full p-2.5 mb-4 bg-gray-700 rounded border border-gray-600 text-sm">
        
        <button id="authBtn" onclick="handleAuth()" class="w-full bg-blue-600 hover:bg-blue-700 py-2.5 rounded font-bold text-sm transition mb-3">Login</button>
        
        <p class="text-center text-xs text-gray-400">
            <span id="switchText">Don't have an account?</span> 
            <button onclick="toggleAuthMode()" class="text-blue-400 underline ml-1 focus:outline-none font-semibold" id="switchBtn">Sign Up</button>
        </p>
    </div>

    <!-- ড্যাশবোর্ড -->
    <div id="dashboard" class="hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">JH Media Growth</h1>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm font-semibold transition">Logout</button>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-8 shadow-lg">
            <h2 class="text-lg font-bold mb-4">Create New Order</h2>
            
            <select id="service" class="w-full p-2.5 mb-4 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none">
                <option value="">-- Choose Your Service --</option>
                <optgroup label="YouTube Shorts Views">
                    <option value="YT Shorts 5K - 250tk">YouTube Shorts 5K - 250tk</option>
                    <option value="YT Shorts 10K - 500tk">YouTube Shorts 10K - 500tk</option>
                    <option value="YT Shorts 1M - 1150tk">YouTube Shorts 1M - 1150tk</option>
                </optgroup>
                <optgroup label="YouTube Long Video Views">
                    <option value="YT Long 1K - 350tk">YouTube Long 1K - 350tk</option>
                    <option value="YT Long 10K - 750tk">YouTube Long 10K - 750tk</option>
                    <option value="YT Long 50K - 1350tk">YouTube Long 50K - 1350tk</option>
                    <option value="YT Long 1000K - 2500tk">YouTube Long 1000K - 2500tk</option>
                </optgroup>
                <optgroup label="YouTube Subscribers">
                    <option value="YT Sub 1000 - 50tk">YouTube Subscribers 1000 - 50tk</option>
                    <option value="YT Sub 5000 - 250tk">YouTube Subscribers 5000 - 250tk</option>
                    <option value="YT Sub 10000 - 550tk">YouTube Subscribers 10000 - 550tk</option>
                </optgroup>
                <optgroup label="Facebook Video Views">
                    <option value="FB Video 10K - 150tk">Facebook Video 10K - 150tk</option>
                    <option value="FB Video 50K - 450tk">Facebook Video 50K - 450tk</option>
                    <option value="FB Video 1M - 2450tk">Facebook Video 1M - 2450tk</option>
                </optgroup>
                <optgroup label="Facebook Followers">
                    <option value="FB Follow 1000 - 25tk">Facebook Followers 1000 - 25tk</option>
                    <option value="FB Follow 5000 - 250tk">Facebook Followers 5000 - 250tk</option>
                    <option value="FB Follow 10000 - 550tk">Facebook Followers 10000 - 550tk</option>
                </optgroup>
                <optgroup label="Instagram Followers & Views">
                    <option value="IG Follow 1000 - 30tk">Instagram Followers 1000 - 30tk</option>
                    <option value="IG Follow 5000 - 140tk">Instagram Followers 5000 - 140tk</option>
                    <option value="IG View 1000 - 25tk">Instagram Views 1000 - 25tk</option>
                    <option value="IG View 10000 - 300tk">Instagram Views 10000 - 300tk</option>
                </optgroup>
                <optgroup label="TikTok Followers & Views">
                    <option value="TT Follow 1000 - 20tk">TikTok Followers 1000 - 20tk</option>
                    <option value="TT Follow 5000 - 100tk">TikTok Followers 5000 - 100tk</option>
                    <option value="TT Follow 10000 - 200tk">TikTok Followers 10000 - 200tk</option>
                    <option value="TT View 5K - 40tk">TikTok Views 5K - 40tk</option>
                    <option value="TT View 10K - 80tk">TikTok Views 10K - 80tk</option>
                </optgroup>
            </select>

            <div class="flex gap-4 mb-4 text-sm bg-gray-700 p-2.5 rounded border border-gray-600">
                <label><input type="radio" name="payment" value="Bkash" checked class="mr-1"> Bkash</label>
                <label><input type="radio" name="payment" value="Nagad" class="mr-1"> Nagad</label>
                <label><input type="radio" name="payment" value="Rocket" class="mr-1"> Rocket</label>
            </div>

            <input type="text" id="senderNumber" placeholder="Sender Number" class="w-full p-2.5 mb-3 bg-gray-700 rounded border border-gray-600 text-sm">
            <input type="text" id="trxId" placeholder="Transaction ID" class="w-full p-2.5 mb-3 bg-gray-700 rounded border border-gray-600 text-sm">
            <input type="text" id="link" placeholder="Order Link" class="w-full p-2.5 mb-4 bg-gray-700 rounded border border-gray-600 text-sm">
            
            <button onclick="submitOrder()" class="w-full bg-indigo-600 py-2.5 rounded font-bold text-sm">Confirm Order</button>
        </div>

        <!-- Admin Panel -->
        <div id="adminContainer" class="mt-8 p-4 bg-gray-800 rounded-lg hidden shadow-lg">
            <h2 class="text-lg font-bold text-white mb-3">Admin Panel</h2>
            <table class="w-full text-left text-gray-300 text-xs">
                <thead><tr class="border-b border-gray-600 text-gray-400"><th class="py-2">ID</th><th>Service</th><th>Status</th></tr></thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "jhmediagrowth@gmail.com";
        let isSignupMode = false;

        window.onload = () => {
            if (localStorage.getItem("userEmail")) {
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                if (localStorage.getItem("userEmail") === ADMIN_EMAIL) {
                    document.getElementById('adminContainer').classList.remove('hidden');
                }
            }
        };

        function toggleAuthMode() {
            isSignupMode = !isSignupMode;
            document.getElementById('authTitle').innerText = isSignupMode ? "Sign Up for JH Media" : "Login to JH Media";
            document.getElementById('authBtn').innerText = isSignupMode ? "Sign Up" : "Login";
            document.getElementById('nameInput').classList.toggle('hidden', !isSignupMode);
            document.getElementById('switchText').innerText = isSignupMode ? "Already have an account?" : "Don't have an account?";
            document.getElementById('switchBtn').innerText = isSignupMode ? "Login" : "Sign Up";
        }

        function handleAuth() {
            const email = document.getElementById('emailInput').value;
            if(!email) {
                alert("Please enter your email!");
                return;
            }
            localStorage.setItem("userEmail", email);
            location.reload();
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function submitOrder() {
            const service = document.getElementById("service").value;
            if(!service) return alert("Select a service first!");
            alert("Order Submitted Successfully!");
            location.reload();
        }
    </script>
</body>
</html>
